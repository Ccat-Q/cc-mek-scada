# Rebuild minified application files and installation manifest, then commit
# them back to the repository. Builds are served via raw.githubusercontent.com
# (accelerated by gh-proxy in ccmsi.lua), so no GitHub Pages deployment is needed.
name: Deploy Software System

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - devel

# Allows committing generated builds back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Create Deployment Directories
        shell: bash
        run: mkdir -p builds/${{ github.ref_name }} manifests/${{ github.ref_name }}
      - name: Generate Minified Code
        shell: bash
        run: python build/gen_minified.py builds/${{ github.ref_name }} --deployment
      - name: Generate Installation Manifest
        shell: bash
        run: python build/gen_manifest.py builds/${{ github.ref_name }}
      - name: Move Installation Manifest
        shell: bash
        run: mv install_manifest.json manifests/${{ github.ref_name }}/
      - name: Commit and Push Builds
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/ manifests/
          if git diff --cached --quiet; then
            echo "No changes to builds, skipping commit."
            exit 0
          fi
          git commit -m "chore: rebuild minified builds and manifest for ${{ github.ref_name }}"
          git push origin ${{ github.ref_name }}
